name: Build and Deploy FastAPI App

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: devopsbootcampa/fastapi-app:latest
          no-cache: true

  deploy:
    needs: build-and-push
    runs-on: ubuntu-latest
    steps:
      - name: Deploy FastAPI container to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          port: 22
          script: |
            # Pull latest image from Docker Hub
            sudo docker pull devopsbootcampa/fastapi-app:latest

            # Stop and remove old container if running
            sudo docker stop fastapi-app || true
            sudo docker rm fastapi-app || true

            # Run new container on port 8002 locally (mapping to container port 8000)
            sudo docker run -d \
              --name fastapi-app \
              --restart unless-stopped \
              -p 127.0.0.1:8002:8000 \
              devopsbootcampa/fastapi-app:latest

            # Verify containers
            sudo docker ps